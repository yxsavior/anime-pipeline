[project]
name = "anime-pipeline"
version = "0.1.0"
description = "Anime Pipeline using the Tenrai API"
requires-python = ">=3.12"

dependencies = [
    "requests",
    "python-dotenv",
    "psycopg[binary]",
]

[dependency-groups]
dev = [
    "jupyter",
    "ruff",
]

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
